<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>北京中考-哪个学校离我近</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>哪个学校离我近</h1>
      <p class="tagline">北京中考通勤参考 · M1</p>
    </header>

    <main>
      <form id="search-form" class="search-form" autocomplete="off">
        <div class="field">
          <label for="address-input">家庭地址</label>
          <div class="input-with-action">
            <input id="address-input" type="text" placeholder="比如：望京西园四区">
            <button type="button" id="pick-on-map-btn" class="btn-secondary">地图选位置</button>
          </div>
        </div>

        <div class="field">
          <label for="district-select">招生区</label>
          <select id="district-select" required>
            <option value="">请选择</option>
          </select>
          <small class="hint">按你实际能报志愿的区选择（京籍可填户籍区或学籍区，非京籍按学籍区）</small>
        </div>

        <button type="submit" id="search-btn" disabled>查询</button>
      </form>

      <div id="map" class="map-container"></div>
    </main>

    <footer class="app-footer">
      <small>数据由 AI 辅助整理，请以学校官方公告为准</small>
    </footer>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
